<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mikes Tool</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo-section">
                <img src="https://mikesjustformen.nl/wp-content/uploads/2022/02/Mikes-just-for-men-Logo-wit.svg" alt="Mike's Just For Men" class="logo-image">
            </div>
            <h1>Mikes Tool</h1>
        </div>
        <nav class="main-tabs">
            <button id="tabExporter" class="main-tab active">Exporter</button>
            <button id="tabMapping" class="main-tab">Mapping</button>
            <button id="tabConverter" class="main-tab">Converter</button>
        </nav>
    </header>

    <main>
        <div id="exporterTabContent">
            <div class="card">
                <p class="card-title">Kies een .csv of .xlsx/.xls bestand</p>
                <input type="file" id="csvFileInput" accept=".csv,.xlsx,.xls">
                <div class="tabs-container" id="tabsContainer" style="display:none; margin-top:15px;"></div>
            </div>

            <div id="exportControls" style="display:none;">
                <div class="card">
                    <div class="controls-top">
                        <div class="controls-left">
                            <button id="reloadButton">Herlaad Bestand</button>
                            <label><input type="checkbox" id="masterCheckbox" checked> Alles selecteren</label>
                            <label for="delimiter">Separator:</label>
                            <select id="delimiter">
                                <option value=";" selected>Puntkomma (;)</option>
                                <option value=",">Komma (,)</option>
                                <option value="\t">Tab</option>
                            </select>
                        </div>
                        <div class="controls-right">
                            <button id="exportButton">Exporteer Alle Rijen</button>
                            <button id="exportMarkedButton">Exporteer Gemarkeerde Rijen</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card" id="tableCard" style="display:none;">
                <div class="table-container" id="tableContainer">
                    <table id="csvTable"><thead></thead><tbody></tbody></table>
                </div>
            </div>
            <div class="card" id="infoMessageCard">
                <div class="info-message" id="infoMessage">Selecteer een bestand om te beginnen</div>
            </div>
        </div>

        <div id="mappingTabContent" style="display:none;">
            <div class="card">
                <div class="mapping-header-bar">
                    <button id="mapFilesButton" disabled>Map Files (Koppel Bestanden)</button>
                </div>
                <div class="mapping-flex-group" style="display: flex; gap: 20px; margin-top: 20px;">
                    <div class="mapping-file-block" style="flex: 1;">
                        <span class="mapping-file-label">Bestand 1 (Basis)</span>
                        <input type="file" id="mappingFileInput1" accept=".csv,.xlsx,.xls">
                        <label>Separator: <select id="mappingDelimiter1"><option value=";">;</option><option value=",">,</option><option value="\t">Tab</option></select></label>
                        <label>Kopregel: <select id="headerRowSelector1"></select></label>
                        <div id="mappingPreview1" class="mapping-preview-wide" style="height:150px; overflow:auto; border:1px solid #ddd; margin-top:10px;"></div>
                    </div>
                    <div class="mapping-file-block" style="flex: 1;">
                        <span class="mapping-file-label">Bestand 2 (Data bron)</span>
                        <input type="file" id="mappingFileInput2" accept=".csv,.xlsx,.xls">
                        <label>Separator: <select id="mappingDelimiter2"><option value=";">;</option><option value=",">,</option><option value="\t">Tab</option></select></label>
                        <label>Kopregel: <select id="headerRowSelector2"></select></label>
                        <div id="mappingPreview2" class="mapping-preview-wide" style="height:150px; overflow:auto; border:1px solid #ddd; margin-top:10px;"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="converterTabContent" style="display:none;">
            <div class="card">
                <p class="card-title">PDF naar Excel converter</p>
                <input type="file" id="pdfFileInput" accept="application/pdf">
            </div>
            <div id="pdfVisualPreviewContainer" class="card" style="display:none;">
                <div id="pdfVisualPreview"></div>
                <button id="convertPdfBtn">Converteer naar Excel</button>
            </div>
            <div id="pdfDataPreviewContainer" class="card" style="display:none;">
                <div id="pdfDataPreview"></div>
                <button id="downloadExcelBtn" disabled>Download Excel</button>
            </div>
        </div>
    </main>

    <div id="mappingPopup" class="popup-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
        <div class="popup-content card" style="background:white; padding:30px; border-radius:8px; max-width:800px; width:90%;">
            <h3 style="margin-bottom:20px;">Kolommen mappen (2-kolom match)</h3>
            <div style="display:flex; gap:30px; margin-bottom:20px;">
                <div style="flex:1;">
                    <h4>Bestand 1</h4>
                    <label>Koppelkolom 1: <select id="joinKey1" style="width:100%; margin-bottom:10px;"></select></label>
                    <label>Koppelkolom 2 (Optioneel): <select id="joinKey1_alt" style="width:100%;"><option value="">-- Geen --</option></select></label>
                </div>
                <div style="flex:1;">
                    <h4>Bestand 2</h4>
                    <label>Koppelkolom 1: <select id="joinKey2" style="width:100%; margin-bottom:10px;"></select></label>
                    <label>Koppelkolom 2 (Optioneel): <select id="joinKey2_alt" style="width:100%;"><option value="">-- Geen --</option></select></label>
                    <hr style="margin:15px 0;">
                    <label>Extra kolommen uit bestand 2: <select id="columnsToAdd2" multiple style="width:100%; height:100px;"></select></label>
                </div>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <label><input type="checkbox" id="onlyMatchedRows" checked> Alleen matches exporteren</label>
                <div>
                    <button id="exportMappingButton">Exporteer Resultaat</button>
                    <button id="closeMappingButton" style="background:#888;">Sluiten</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="pdf2excel.js"></script>
    <script src="app.js"></script>
</body>
</html>
